<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10141b">
  <title>Karaoke Maker</title>
  <link data-trunk rel="rust" data-target-name="karaoke-maker">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #10141b; color: #e2e8f0; font: 18px system-ui; }
    canvas { width: 100%; height: 100%; display: block; }
    #loading { position: absolute; inset: 40% 15% auto; text-align: center; line-height: 1.6; }
  </style>
</head>
<body>
  <canvas id="karaoke_canvas" aria-label="Karaoke Maker lyric editor"></canvas>
  <div id="loading" role="status">Starting Karaoke Maker…</div>
  <noscript>This editor needs JavaScript and WebAssembly. You can also use the desktop app.</noscript>
</body>
</html>
